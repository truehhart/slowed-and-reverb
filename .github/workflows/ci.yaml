name: ci
run-name: "[${{ github.ref_name }}] ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}"

on:
  push:
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  ci:
    runs-on: macos-26
    steps:
      - name: "[Setup] | Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "[Setup] | Cache Swift build"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-${{ runner.os }}-

      - name: "[Setup] | Mise"
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          experimental: true

      - name: "[Check] | swift-format lint"
        shell: bash -euo pipefail {0}
        run: mise run check:fmt

      - name: "[Check] | Swift build"
        shell: bash -euo pipefail {0}
        run: mise run check:build

      - name: "[Check] | File structure"
        shell: bash -euo pipefail {0}
        run: mise run check:structure

      - name: "[Test] | Swift Testing"
        shell: bash -euo pipefail {0}
        run: mise run test
