name: release
run-name: "[${{ github.ref_name }}] ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: "[Setup] | Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "[Validate] | Read VERSION"
        id: version
        shell: bash -euo pipefail {0}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::VERSION '$VERSION' is not semver MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: "[Validate] | Tag and release do not exist"
        shell: bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"
            exit 1
          fi
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists"
            exit 1
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  tag:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      # App token, not GITHUB_TOKEN: a GITHUB_TOKEN push won't trigger publish.yml.
      - name: "[Setup] | Mint release token"
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: "[Setup] | Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.token.outputs.token }}

      - name: "[Release] | Create and push tag"
        shell: bash -euo pipefail {0}
        run: |
          git tag "${TAG}"
          git push origin "${TAG}"
