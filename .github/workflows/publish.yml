name: publish
run-name: publish ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

# tauri-action drafts the release; the cask push happens cross-repo via an App token.
permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: "[Setup] | Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "[Setup] | Mise"
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: "[Setup] | Install JS deps"
        shell: bash -euo pipefail {0}
        run: pnpm install --frozen-lockfile

      - name: "[Publish] | Build bundle + draft release"
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "slowed-and-reverb ${{ github.ref_name }}"
          releaseDraft: true

      # The curl|sh installer fetches this; curl skips quarantine so the app opens clean.
      - name: "[Publish] | Attach .app tarball for curl installer"
        shell: bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          app="$(find src-tauri/target -path '*/bundle/macos/*.app' | head -n1)"
          test -n "$app" || { echo "::error::no .app found under src-tauri/target"; exit 1; }
          tar -C "$(dirname "$app")" -czf slowed-and-reverb.app.tar.gz "$(basename "$app")"
          gh release upload "$TAG" slowed-and-reverb.app.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      # Cross-repo push to truehhart/homebrew-tap; GITHUB_TOKEN can't reach it.
      - name: "[Setup] | Mint Homebrew tap token"
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: truehhart
          repositories: homebrew-tap

      - name: "[Publish] | Generate and push Homebrew cask"
        shell: bash -euo pipefail {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          dmg="$(find src-tauri/target -path '*/bundle/dmg/*.dmg' | head -n1)"
          test -n "$dmg" || { echo "::error::no .dmg found under src-tauri/target"; exit 1; }
          sha="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          # Exact browser download URL of the asset tauri-action uploaded (handles space-encoding).
          dmg_url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[] | select(.name | endswith(".dmg")) | .url')"
          test -n "$dmg_url" || { echo "::error::no .dmg asset on release $TAG"; exit 1; }

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/truehhart/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/slowed-and-reverb.rb <<EOF
          # This file is generated by the slowed-and-reverb publish workflow. DO NOT EDIT.
          cask "slowed-and-reverb" do
            version "${version}"
            sha256 "${sha}"

            url "${dmg_url}"
            name "Slowed and Reverb"
            desc "Play YouTube audio slowed and reverbed"
            homepage "https://github.com/truehhart/slowed-and-reverb"

            depends_on arch: :arm64

            app "Slowed and Reverb.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/Slowed and Reverb.app"]
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/slowed-and-reverb.rb
          git commit -m "chore(slowed-and-reverb): release ${version}"
          git push
