name: check
run-name: check ${{ github.ref_name }}

on:
  push:
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  check:
    runs-on: macos-26
    steps:
      - name: "[Setup] | Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "[Setup] | Cache Swift build"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-${{ runner.os }}-

      - name: "[Setup] | Mise"
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          experimental: true

      - name: "[Check] | swift-format lint"
        shell: bash -euo pipefail {0}
        run: mise run check:fmt

      - name: "[Check] | Swift build"
        shell: bash -euo pipefail {0}
        run: mise run check:build

      - name: "[Test] | Swift Testing"
        shell: bash -euo pipefail {0}
        run: mise run test
