[tools]
rust = "stable"
node = "26"
pnpm = "11"
yt-dlp = "latest"
"aqua:nushell/nushell" = "latest"

[tasks.dev]
description = "Run the app in dev mode (vite + tauri, hot reload)"
run = [
  # ponytail: drop the release build (~1.6G) dev never uses; rebuilt on next `mise run build`
  "cargo clean --release --manifest-path src-tauri/Cargo.toml",
  "pnpm tauri dev",
]

[tasks."prepare:sidecars"]
description = "Copy locally installed sidecars into Tauri's bundle input"
run = "nu mise-tasks/prepare-sidecars.nu"

[tasks.build]
description = "Build the production .app bundle"
depends = ["prepare:sidecars"]
run = "pnpm tauri build"

[tasks."check:ts"]
description = "Type-check the TypeScript frontend"
run = "pnpm exec tsc --noEmit"

[tasks."check:rs"]
description = "Check Rust formatting and lint"
# tauri-build validates externalBin at compile time, so the sidecar must exist
depends = ["prepare:sidecars"]
run = [
  "cargo fmt --manifest-path src-tauri/Cargo.toml --check",
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings",
]

[tasks."check:dom"]
description = "Assert every id main.ts needs via el() exists in index.html"
run = "nu mise-tasks/check-dom.nu"

[tasks.check]
description = "Everything the pre-commit hook runs (dom + type-check + rust fmt/clippy)"
depends = ["check:dom", "check:ts", "check:rs"]

[tasks."check:unit"]
description = "Vitest unit tests for src/ui-math.ts"
run = "pnpm exec vitest run"

[tasks."check:web"]
description = "Playwright design tests against the Vite page (hash harness)"
run = "pnpm exec playwright test"

[tasks."check:rs-test"]
description = "Rust unit tests"
run = "cargo test --manifest-path src-tauri/Cargo.toml"

[tasks.test]
description = "Full test suite — unit (Vitest) + Rust + web (Playwright)"
depends = ["check:unit", "check:rs-test", "check:web"]

[tasks.fmt]
description = "Auto-format TypeScript (prettier) and Rust (cargo fmt)"
run = [
  "pnpm exec prettier --write .",
  "cargo fmt --manifest-path src-tauri/Cargo.toml",
]

[tasks.lint]
description = "Lint Rust with clippy"
run = "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings"
