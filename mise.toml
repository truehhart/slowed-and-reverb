[settings]
experimental = true # core swift backend

[tools]
yt-dlp = "latest"
"aqua:nushell/nushell" = "latest"
watchexec = "latest"
swift = "6.3.3"

[tasks.dev]
description = "Run the app and restart it when Swift sources change"
run = "mise watch dev:run --restart --watch Sources --watch Package.swift --watch Package.resolved"

[tasks."dev:run"]
hide = true
run = "mise exec -- swift run"

[tasks.build]
description = "Assemble the release .app bundle (packaging/, Sparkle, yt-dlp)"
run = "nu mise-tasks/bundle.nu release"

[tasks."check:build"]
description = "Compile the Swift package"
run = "mise exec -- swift build"

[tasks."check:fmt"]
description = "Lint Swift formatting (swift-format, warnings are errors)"
run = "mise exec -- swift format lint --strict --recursive Sources Tests"

[tasks."check:structure"]
description = "Enforce one non-private top-level type per Swift file (named after the file)"
run = "nu mise-tasks/check-file-structure.nu"

[tasks.check]
description = "Everything the pre-commit hook runs (swift build + format lint + file structure)"
depends = ["check:build", "check:fmt", "check:structure"]

[tasks.test]
description = "Swift Testing unit tests"
run = "mise exec -- swift test"

[tasks.fmt]
description = "Auto-format Swift sources"
run = "mise exec -- swift format --in-place --recursive Sources Tests"

[tasks.lint]
description = "Lint Swift formatting (swift-format, warnings are errors)"
run = "mise exec -- swift format lint --strict --recursive Sources Tests"
